name: AppPang CI

# develop 브랜치에 Push 될 때마다 실행
on:
  push:
    branches:
      - develop

jobs:
  build:
    # GitHub에서 제공하는 Ubuntu 환경에서 실행
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub Repository 코드를 가져온다.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 21 환경을 설치한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. gradlew 실행 권한을 부여한다.
      - name: Grant execute permission
        run: chmod +x gradlew

      # 4. Gradle 라이브러리를 캐싱하여 빌드 속도를 향상시킨다.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 5. 프로젝트를 빌드하고 테스트를 수행한다.
      - name: Build Project
        run: ./gradlew clean build