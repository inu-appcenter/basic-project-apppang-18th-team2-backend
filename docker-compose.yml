services:
  app:
    image: apppang2:latest

    container_name: apppang2

    build:
      context: .
      dockerfile: Dockerfile


    env_file:
      - .env

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: apppang-nginx

    ports:
      - "80:80"

    volumes:
      # 프론트 빌드 결과물(dist)이 복사되는 폴더
      - ./front-dist:/usr/share/nginx/html:ro
      # 리버스 프록시 설정
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped
