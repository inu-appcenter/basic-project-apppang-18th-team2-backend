# 리버스 프록시 + 프론트 정적 서빙 설정
server {
    listen 80;

    client_max_body_size 12M;

    # 응답 압축 (JSON·JS·CSS 전송량 절감)
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # API 요청은 스프링 컨테이너로 전달
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger 관련 경로도 스프링으로 전달
    location /api-docs           { proxy_pass http://app:8080; }
    location /swagger-ui         { proxy_pass http://app:8080; }
    location /swagger-resources  { proxy_pass http://app:8080; }
    location /webjars            { proxy_pass http://app:8080; }

    # 나머지 전부 → React 빌드 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /index.html;
    }
}
